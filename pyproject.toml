[project]
name = "ha-youtube-on-tv"
version = "1.0.0"
description = "Home Assistant integration showing what the YouTube app on your TV is playing"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components.youtube_on_tv"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "B",    # bugbear
  "BLE",  # blind except
  "D",    # docstrings
  "E",
  "F",
  "I",    # isort
  "PL",   # pylint
  "RUF",
  "S",    # bandit
  "SIM",
  "UP",
  "W",
]
ignore = [
  "D202",
  "D203",
  "D213",
  "E501",
  "PLR0911",
  "PLR0912",
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR0913", "PLR0917", "PLC0415", "SLF001"]
"custom_components/**/coordinator.py" = ["S101"]
"custom_components/**/config_flow.py" = ["BLE001", "S101"]
"custom_components/**/entity.py" = ["S101"]
"scripts/**" = ["D", "BLE001", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "homeassistant"]
combine-as-imports = true
