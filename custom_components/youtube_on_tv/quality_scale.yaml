# Home Assistant's Integration Quality Scale, as a checklist for this integration.
# Hassfest only validates this file for core integrations; it is kept by hand.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions; it uses the standard media player and to-do ones.
  appropriate-polling:
    status: done
    comment: >-
      The TV pushes playback over the Lounge session. Only the DIAL app state is
      polled, every 30 s, since the TV doesn't announce it.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no actions of its own.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing themselves; the coordinator owns the session.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry is one TV.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: >-
      The only setting that changes is the TV's address, and SSDP rediscovery or
      adding the TV again by address already updates it. A TV added with a code
      has no address, and a new code goes through reauthentication.
  repair-issues:
    status: exempt
    comment: Nothing the integration detects needs the user to act, beyond reauthentication.
  stale-devices:
    status: exempt
    comment: Each config entry is one TV.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: >-
      DIAL and oEmbed use Home Assistant's session, but pyytlounge creates its own
      for the Lounge session and takes none.
  strict-typing: todo
